name: plugin version bump

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard tests
        run: bash scripts/test-check-plugin-version-bump.sh
      - name: Plugin changed without a version bump?
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # For a pull request HEAD is the merge of the PR into the base branch, so compare
          # against the base branch TIP: both sides then carry any bump main already took,
          # and only the PR's own bump can make the versions differ.
          if [ "$EVENT" = "pull_request" ]; then base="origin/$BASE_REF"; else base="$PUSH_BEFORE"; fi
          out="$(bash scripts/check-plugin-version-bump.sh "$base" HEAD)"; status=$?
          echo "$out"
          case "$out" in *skipped*) echo "::warning::version-bump guard skipped: $out" ;; esac
          exit "$status"
